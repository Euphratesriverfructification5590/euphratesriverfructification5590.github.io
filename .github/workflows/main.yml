name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A4C40D: ${{ secrets.A4C40D }}
          BA61B0: ${{ secrets.BA61B0 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A4C40D', '')
          meta_b = os.environ.get('BA61B0', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- ecdd5795ed50984d667e28bd4746f5b64b -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 18a76b8aa9799bdf7d6241fcc594d3f5747058dc223a0e55 -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
